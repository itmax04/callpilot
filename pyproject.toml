[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name = "callpilot"
version = "0.1.0"
description = "Small reproducible call-quality analysis demo"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "openai>=1.40,<2",
  "streamlit>=1.36,<2",
  "python-dotenv>=1.0,<2",
]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[project.scripts]
callpilot = "callpilot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include=["callpilot*"]
